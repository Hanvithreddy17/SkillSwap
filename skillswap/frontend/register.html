<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration — SkillSwap</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="site-header">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-badge">SS</span>
        <span>SkillSwap</span>
      </a>

      <nav>
        <ul class="nav-menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="explore.html">Explore Skills</a></li>
        </ul>
      </nav>

      <div id="nav-user-panel" class="nav-user-panel">
        <a href="login.html" class="btn btn-outline btn-sm">Login</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card">
        
        <div class="auth-header">
          <h2>Create Student Account</h2>
          <p>Join fellow students in peer-to-peer skill exchange</p>
        </div>

        <form id="register-form">
          <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" class="form-control" placeholder="e.g. Priya Sharma" required>
          </div>

          <div class="form-group">
            <label for="email">College Email *</label>
            <input type="email" id="email" class="form-control" placeholder="e.g. priya@college.edu" required>
            <span class="form-help">Must be a valid email address.</span>
          </div>

          <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
          </div>

          <div class="form-group">
            <label for="department">Department / Branch *</label>
            <select id="department" class="form-control" required>
              <option value="">-- Select Your Department --</option>
              <option value="Computer Science">Computer Science & Engineering</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Electronics & Comm.">Electronics & Communication</option>
              <option value="Electrical Engineering">Electrical Engineering</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
              <option value="Civil Engineering">Civil Engineering</option>
              <option value="Applied Sciences">Applied Sciences / Mathematics</option>
              <option value="Management Studies">Management Studies</option>
              <option value="Other">Other Department</option>
            </select>
          </div>

          <div class="form-group">
            <label for="year_of_study">Year of Study *</label>
            <select id="year_of_study" class="form-control" required>
              <option value="">-- Select Current Year --</option>
              <option value="1st Year">1st Year (Freshman)</option>
              <option value="2nd Year">2nd Year (Sophomore)</option>
              <option value="3rd Year">3rd Year (Junior)</option>
              <option value="4th Year">4th Year (Senior)</option>
              <option value="Postgraduate">Postgraduate / Masters</option>
            </select>
          </div>

          <div class="form-group">
            <label for="bio">Bio & Academic Interests (Optional)</label>
            <textarea id="bio" class="form-control" placeholder="Briefly introduce your skills and what you're excited to learn..."></textarea>
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 10px;">
            Register Account
          </button>
        </form>

        <div class="auth-footer">
          <p>Already have an account? <a href="login.html">Log In here</a></p>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 <strong>SkillSwap</strong>. Empowering peer-to-peer student skill exchange.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth({ redirectIfAuth: true });

      const form = document.getElementById('register-form');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const department = document.getElementById('department').value;
        const year_of_study = document.getElementById('year_of_study').value;
        const bio = document.getElementById('bio').value;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Registering...';

        const res = await apiPost('/api/auth/register', {
          name,
          email,
          password,
          department,
          year_of_study,
          bio
        });

        submitBtn.disabled = false;
        submitBtn.textContent = 'Register Account';

        if (res.ok && res.data.success) {
          showToast('Account created successfully! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 800);
        } else {
          showToast(res.data.message || 'Registration failed.', 'error');
        }
      });
    });
  </script>
</body>
</html>
